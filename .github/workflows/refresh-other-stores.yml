name: Refresh other store catalog

on:
  schedule:
    - cron: "43 2 * * 3"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zabhop-catalog-write
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the canonical ŻabHop repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch and validate current OpenStreetMap stores
        run: node Tools/RefreshOtherStores.mjs
      - name: Verify the public manifest and bundled iOS catalog
        run: node Tools/ValidateCatalogs.mjs --other
      - name: Commit changed catalog
        run: |
          if git diff --quiet -- other-stores.json other-stores-manifest.json ZabHop/Resources/other-stores.json; then
            echo "Catalog unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add other-stores.json other-stores-manifest.json ZabHop/Resources/other-stores.json
          git commit -m "chore: refresh other store catalog"
          git push
