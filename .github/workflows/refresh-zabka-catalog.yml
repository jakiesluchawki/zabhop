name: Refresh Żabka catalog

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-zabka-catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and validate catalog
        run: node Tools/RefreshZabkaCatalog.mjs
      - name: Commit changed catalog
        run: |
          if git diff --quiet -- web/stores.json web/stores-manifest.json ZabHop/Resources/stores.json; then
            echo "Catalog unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/stores.json web/stores-manifest.json ZabHop/Resources/stores.json
          git commit -m "chore: refresh Żabka store catalog"
          git push
