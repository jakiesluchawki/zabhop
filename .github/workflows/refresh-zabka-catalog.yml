name: Refresh Żabka catalog

on:
  schedule:
    - cron: "17 3 * * *"
    - cron: "47 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zabhop-catalog-write
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out the canonical ŻabHop repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify catalog recovery safeguards
        run: node --test Tools/zabka-catalog-source.test.mjs
      - name: Build and validate catalog
        run: node Tools/RefreshZabkaCatalog.mjs
      - name: Verify the public manifest and bundled iOS catalog
        run: node Tools/ValidateCatalogs.mjs --zabka
      - name: Commit changed catalog
        run: |
          if git diff --quiet -- stores.json stores-manifest.json ZabHop/Resources/stores.json; then
            echo "Catalog unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stores.json stores-manifest.json ZabHop/Resources/stores.json
          git commit -m "chore: refresh Żabka store catalog"
          git push
